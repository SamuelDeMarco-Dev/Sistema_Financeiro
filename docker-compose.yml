services:
  postgres:
    image: postgres:16-alpine
    container_name: pfm_postgres
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: pfm
      POSTGRES_PASSWORD: pfm_local
      POSTGRES_DB: pfm
    volumes: [pfm_dev:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfm"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_teste:
    image: postgres:16-alpine
    container_name: pfm_postgres_teste
    restart: unless-stopped
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: pfm
      POSTGRES_PASSWORD: pfm_local
      POSTGRES_DB: pfm_teste
    tmpfs: [/var/lib/postgresql/data] # em memória: testes rápidos, dados descartáveis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfm"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: pfm_mailpit
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"] # SMTP · interface web

volumes:
  pfm_dev:
