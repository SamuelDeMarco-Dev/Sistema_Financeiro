# Vive em /etc/nginx/sites-available/pfm-staging no servidor
# (08-CICD.md §4.2). Mesmo bloco de pfm.conf, com três diferenças:
# proxy para 127.0.0.1:3334, autenticação básica e robots.txt bloqueando
# indexação (#62: homologação não deve aparecer em busca).
#
# Gerar a senha da autenticação básica:
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd-staging deploy

server {
    listen 80;
    listen [::]:80;
    server_name staging.dominio.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name staging.dominio.com;

    ssl_certificate     /etc/letsencrypt/live/dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominio.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dominio.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Robots-Tag              "noindex, nofollow" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    client_max_body_size 6M;
    client_body_timeout 30s;

    # robots.txt bloqueando indexação, sem exigir login para o crawler
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        auth_basic "Homologacao PFM";
        auth_basic_user_file /etc/nginx/.htpasswd-staging;

        proxy_pass http://127.0.0.1:3334;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;
    }

    root /var/www/pfm-staging;
    index index.html;

    location ~* \.(js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
        auth_basic "Homologacao PFM";
        auth_basic_user_file /etc/nginx/.htpasswd-staging;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        auth_basic "Homologacao PFM";
        auth_basic_user_file /etc/nginx/.htpasswd-staging;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        auth_basic "Homologacao PFM";
        auth_basic_user_file /etc/nginx/.htpasswd-staging;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/pfm-staging-acesso.log;
    error_log  /var/log/nginx/pfm-staging-erro.log warn;
}
