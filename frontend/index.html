<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciador de Finanças</title>
    <script>
      // Aplica o tema antes da hidratacao do React, evitando o flash do tema
      // errado (mesma chave e regra de 'SISTEMA' de contextos/ContextoTema.tsx).
      (function () {
        var armazenado = window.localStorage.getItem('pfm:tema');
        var escuro =
          armazenado === 'ESCURO' ||
          ((armazenado === 'SISTEMA' || !armazenado) &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', escuro);
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
